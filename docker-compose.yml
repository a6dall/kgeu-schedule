services:
  kgeu-schedule:
    build: .
    container_name: kgeu-schedule
    restart: unless-stopped
    ports:
      # Внешний порт на VPS : Внутренний порт контейнера
      # Если порт 8000 занят, можно поменять на "8080:8000" или "80:8000"
      - "8000:8000"
    volumes:
      # Монтируем рабочую директорию проекта:
      # Благодаря этому после `git pull` изменения применяются мгновенно без пересборки контейнера
      - ./:/app
      # Сохраняем состояние заметок и кэша
      - ./data:/app/data
    environment:
      - PORT=8000
      - HOST=0.0.0.0
